<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="760" viewBox="0 0 1420 760" role="img" aria-labelledby="title desc">
  <title id="title">Closed member opaque relay production sequence</title>
  <desc id="desc">A and C retain endpoint cryptographic state while promoted member B validates exact route controls and forwards bounded opaque packets through an exact allocation generation.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#294a62"/></marker><style>.title{font:700 24px sans-serif;fill:#173143}.actor{fill:#f8fbfd;stroke:#527189;stroke-width:2;rx:12}.relay{fill:#eef5ff;stroke:#286f9e;stroke-width:2;rx:12}.h{font:700 15px sans-serif;fill:#173143}.t{font:12px monospace;fill:#213c4f}.s{font:11px sans-serif;fill:#465f70}.life{stroke:#8296a5;stroke-width:2}.msg{stroke:#294a62;stroke-width:2;fill:none;marker-end:url(#a)}.cipher{stroke:#6b4ca5;stroke-width:3;fill:none;marker-end:url(#a)}.close{stroke:#a65037;stroke-width:2;fill:none;marker-end:url(#a)}.phase{font:700 12px sans-serif;fill:#294a62}</style></defs>
  <rect width="1420" height="760" fill="white"/>
  <text class="title" x="710" y="36" text-anchor="middle">Closed member relay (distinct from Hub-encrypted fallback): exact owners and route-bound lifecycle</text>
  <rect class="actor" x="45" y="60" width="360" height="82"/><text class="h" x="225" y="86" text-anchor="middle">Endpoint A</text><text class="t" x="225" y="107" text-anchor="middle">runtime/relay/mod.rs</text><text class="s" x="225" y="126" text-anchor="middle">requester endpoint key and exact A–B session</text>
  <rect class="relay" x="530" y="60" width="360" height="82"/><text class="h" x="710" y="86" text-anchor="middle">Closed member B</text><text class="t" x="710" y="107" text-anchor="middle">engine/closed_relay.rs + runtime/relay/mod.rs</text><text class="s" x="710" y="126" text-anchor="middle">route validator and provider-backed directional queues</text>
  <rect class="actor" x="1015" y="60" width="360" height="82"/><text class="h" x="1195" y="86" text-anchor="middle">Endpoint C</text><text class="t" x="1195" y="107" text-anchor="middle">runtime/relay/mod.rs</text><text class="s" x="1195" y="126" text-anchor="middle">target endpoint key and exact B–C session</text>
  <line class="life" x1="225" y1="142" x2="225" y2="710"/><line class="life" x1="710" y1="142" x2="710" y2="710"/><line class="life" x1="1195" y1="142" x2="1195" y2="710"/>

  <text class="phase" x="28" y="184">PROMOTED LEGS</text>
  <path class="msg" d="M225 205H710"/><text class="s" x="467" y="195" text-anchor="middle">exact current promoted A–B witness</text>
  <path class="msg" d="M1195 235H710"/><text class="s" x="952" y="225" text-anchor="middle">exact current promoted B–C witness</text>

  <text class="phase" x="28" y="288">SETUP</text>
  <path class="msg" d="M225 310H710"/><text class="t" x="467" y="299" text-anchor="middle">Open(context,A,B,C,session; requester share)</text>
  <path class="msg" d="M710 350H1195"/><text class="t" x="952" y="339" text-anchor="middle">Offer(exact route; requester share)</text>
  <path class="msg" d="M1195 390H710"/><text class="t" x="952" y="379" text-anchor="middle">Accept(exact route; target share)</text>
  <path class="msg" d="M710 430H225"/><text class="s" x="467" y="419" text-anchor="middle">accepted exact allocation generation</text>

  <text class="phase" x="28" y="474">OPAQUE DATA</text>
  <path class="cipher" d="M225 495H710"/><text class="s" x="467" y="484" text-anchor="middle">ClosedRelayData(OpaqueRelayPacket)</text>
  <path class="cipher" d="M710 525H1195"/><text class="s" x="952" y="514" text-anchor="middle">same route/generation; bounded queue custody</text>
  <path class="cipher" d="M1195 555H710"/><path class="cipher" d="M710 585H225"/>
  <text class="s" x="710" y="610" text-anchor="middle">protocol/relay.rs fixes the tuple and controls; only A/C seal or open application plaintext</text>

  <text class="phase" x="28" y="646">TERMINAL</text>
  <path class="close" d="M225 660H710"/><text class="s" x="467" y="650" text-anchor="middle">Close(exact route + generation)</text>
  <path class="close" d="M710 685H1195"/><text class="s" x="952" y="675" text-anchor="middle">canonical close once</text>
  <path class="close" d="M1195 710H710"/><path class="close" d="M710 735H225"/>
  <text class="s" x="710" y="728" text-anchor="middle">ack settles allocation and tombstone; shutdown wakes waiters and joins the owned driver</text>
</svg>
