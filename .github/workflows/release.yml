name: Release

# Triggered by the immutable `v*` tag that `just release X.Y.Z` pushes.
# workflow_dispatch is only an escape hatch for rebuilding an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare exact draft release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and repository binding
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          test "$(git remote get-url origin)" = "https://github.com/$GITHUB_REPOSITORY.git"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refuse public/repointed tags and establish draft
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/verify-release-artifact.py
          --preflight-release
          --tag "$TAG"
          --commit "$GITHUB_SHA"
          --repository "$GITHUB_REPOSITORY"

  release-gates:
    name: Verify release source and policy gates
    needs: prepare-release
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and repository binding
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          test "$(git remote get-url origin)" = "https://github.com/$GITHUB_REPOSITORY.git"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify V4 hard-cutover boundary
        run: python scripts/verify-v4-cutover.py

      - name: Verify release workflow and feature boundary
        run: >-
          python scripts/verify-release-artifact.py
          --workflow .github/workflows/release.yml
          --manifest crates/myownmesh/Cargo.toml

  bundles:
    name: Build (${{ matrix.platform.name }})
    needs: [prepare-release, release-gates]
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux builds are pinned to Ubuntu 22.04 (glibc 2.35) — not
          # ubuntu-latest — so the resulting binaries run on Ubuntu
          # 22.04+, Debian 12, and other distros still on glibc
          # 2.35/2.36/2.38. Building on 24.04 links against glibc 2.39
          # and breaks anything older with "GLIBC_2.39 not found".
          # Matches MyOwnLLM's release.yml so users get the same
          # portability promise across both apps.
          - { name: linux-x86_64,   os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { name: linux-aarch64,  os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: macos-aarch64,  os: macos-14,         target: aarch64-apple-darwin }
          - { name: macos-x86_64,   os: macos-14,         target: x86_64-apple-darwin }
          - { name: windows-x86_64, os: windows-latest,   target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.platform.os }}
    env:
      # The updater embeds this exact publication trust anchor at compile time.
      MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
      MYOWNMESH_RELEASE_PUBKEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and repository binding
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          test "$(git remote get-url origin)" = "https://github.com/$GITHUB_REPOSITORY.git"

      # Guard against the "tag says v0.2.0, binary reports 0.1.5"
      # trap. The daemon binary embeds CARGO_PKG_VERSION (via
      # [workspace.package].version) at compile time, and the GUI's
      # window title pulls from gui/src-tauri/Cargo.toml. If any
      # manifest disagrees with the tag, every install will misreport
      # itself and the self-update poll will loop forever. The
      # workspace Cargo.toml is the source of truth; scripts/bump-version.sh
      # keeps the GUI sub-workspace files in sync.
      - name: Verify tag matches manifest versions
        shell: bash
        run: |
          set -e
          TAG="${{ inputs.tag || github.ref_name }}"
          EXPECTED="${TAG#v}"
          fail() { echo "::error::$*"; exit 1; }
          got_workspace=$(awk '
            /^\[workspace\.package\]/ {in_pkg=1; next}
            /^\[/ {in_pkg=0}
            in_pkg && /^version =/ {gsub(/[ "]/, "", $0); split($0, a, "="); print a[2]; exit}
          ' Cargo.toml)
          got_gui_cargo=$(awk -F\" '/^version = / {print $2; exit}' gui/src-tauri/Cargo.toml)
          got_gui_pkg=$(node -e "console.log(require('./gui/package.json').version)")
          [[ "$got_workspace" == "$EXPECTED" ]] || fail "Cargo.toml [workspace.package].version is $got_workspace, expected $EXPECTED (tag $TAG). Run 'just release $EXPECTED' to bump."
          [[ "$got_gui_cargo" == "$EXPECTED" ]] || fail "gui/src-tauri/Cargo.toml version is $got_gui_cargo, expected $EXPECTED (tag $TAG). Run 'just release $EXPECTED' to bump."
          [[ "$got_gui_pkg"   == "$EXPECTED" ]] || fail "gui/package.json version is $got_gui_pkg, expected $EXPECTED (tag $TAG). Run 'just release $EXPECTED' to bump."
          echo "Manifest versions match tag $TAG ($EXPECTED)."

      # Tauri build needs the GTK / webkit stack on Linux; the
      # headless daemon doesn't, but installing here covers both
      # build steps in one place.
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev xdg-utils

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Two separate Cargo workspaces in this repo — the headless
      # daemon at the root, and the Tauri GUI under `gui/src-tauri`.
      # Each gets its own cache scope so they don't stomp each other.
      - name: Cache (daemon workspace)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: daemon-${{ matrix.platform.os }}

      - name: Cache (GUI workspace)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri -> target
          key: gui-${{ matrix.platform.os }}

      # No `version:` — pnpm/action-setup@v4 reads the version from
      # gui/package.json's `packageManager` field. Pinning a
      # different `version:` here causes pnpm 10+ to refuse to run
      # with ERR_PNPM_BAD_PM_VERSION. There is no root package.json
      # in this repo, so point the action at the GUI manifest
      # explicitly — otherwise it fails with "No pnpm version is
      # specified".
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: gui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: Install GUI dependencies
        working-directory: gui
        run: pnpm install --frozen-lockfile

      # Build the headless daemon first. The bundle step below will
      # ship it alongside the GUI installer so users get one
      # download per platform that contains both halves.
      - name: Build daemon (without transport-lab)
        run: cargo build --release --no-default-features --bin myownmesh --target ${{ matrix.platform.target }}

      - name: Verify daemon excludes transport-lab
        shell: bash
        run: |
          set -e
          BIN=target/${{ matrix.platform.target }}/release/myownmesh
          if [[ "${{ runner.os }}" == "Windows" ]]; then BIN="${BIN}.exe"; fi
          python scripts/verify-release-artifact.py \
            --binary "$BIN" \
            --release-public-key "$MINISIGN_PUBLIC_KEY"

      - name: Prove Tauri publication-key binding
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MYOWNMESH_RELEASE_PUBKEY"
          test -n "$MINISIGN_PUBLIC_KEY"
          test "$MYOWNMESH_RELEASE_PUBKEY" = "$MINISIGN_PUBLIC_KEY"

      # Build the GUI-only Tauri bundle. These installers contain the GUI,
      # not the separately shipped daemon binary; the portable GUI archive
      # below is the scanner-covered GUI artifact. `projectPath: gui` points
      # the action at the GUI workspace so it does not build the daemon as a
      # Tauri crate.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
          MYOWNMESH_RELEASE_PUBKEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
        with:
          projectPath: gui
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: ${{ inputs.tag || github.ref_name }}
          # Keep the release unpublished until the final signing job has
          # verified every uploaded payload, including these installers.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.platform.target }}

      - name: Verify every Tauri installer payload
        run: >-
          python scripts/verify-release-artifact.py
          --tree
          gui/src-tauri/target/${{ matrix.platform.target }}/release/bundle

      # Package the portable daemon binary as a tarball / zip so
      # users who don't want the GUI installer can `curl | tar` it.
      # The .sha256 sidecar matches MyOwnLLM's release pattern so
      # the self-updater verification logic is identical.
      - name: Package portable daemon binary
        shell: bash
        run: |
          set -e
          BIN=target/${{ matrix.platform.target }}/release/myownmesh
          if [[ "${{ runner.os }}" == "Windows" ]]; then BIN="${BIN}.exe"; fi
          if [[ ! -f "$BIN" ]]; then
            echo "daemon binary not found at $BIN"; exit 1
          fi

          mkdir -p dist-bin
          NAME="myownmesh-${{ matrix.platform.name }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "$BIN" "dist-bin/myownmesh.exe"
            (cd dist-bin && 7z a "${NAME}.zip" myownmesh.exe)
            (cd dist-bin && (sha256sum "${NAME}.zip" || shasum -a 256 "${NAME}.zip") > "${NAME}.zip.sha256")
            python scripts/verify-release-artifact.py --archive "dist-bin/${NAME}.zip" --member myownmesh.exe
          else
            cp "$BIN" "dist-bin/myownmesh"
            tar -czf "dist-bin/${NAME}.tar.gz" -C dist-bin myownmesh
            (cd dist-bin && (sha256sum "${NAME}.tar.gz" || shasum -a 256 "${NAME}.tar.gz") > "${NAME}.tar.gz.sha256")
            python scripts/verify-release-artifact.py --archive "dist-bin/${NAME}.tar.gz" --member myownmesh
          fi

      # Package the portable GUI binary the same way, so the curl|sh
      # installer can drop `myownmesh-gui` next to `myownmesh` on PATH
      # and a bare `myownmesh` finds it via sibling lookup. The OS
      # bundles (.deb/.dmg/.msi/...) uploaded above are still the
      # "proper install"; this is the lightweight half for the CLI
      # installer. Remove the raw binary afterwards so it isn't caught
      # by the upload glob below — only the archives + .sha256 ship.
      - name: Package portable GUI binary
        shell: bash
        run: |
          set -e
          BIN=gui/src-tauri/target/${{ matrix.platform.target }}/release/myownmesh-gui
          if [[ "${{ runner.os }}" == "Windows" ]]; then BIN="${BIN}.exe"; fi
          if [[ ! -f "$BIN" ]]; then
            echo "GUI binary not found at $BIN"; exit 1
          fi
          mkdir -p dist-bin
          NAME="myownmesh-gui-${{ matrix.platform.name }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "$BIN" "dist-bin/myownmesh-gui.exe"
            (cd dist-bin && 7z a "${NAME}.zip" myownmesh-gui.exe)
            (cd dist-bin && (sha256sum "${NAME}.zip" || shasum -a 256 "${NAME}.zip") > "${NAME}.zip.sha256")
            python scripts/verify-release-artifact.py --archive "dist-bin/${NAME}.zip" --member myownmesh-gui.exe
            rm -f dist-bin/myownmesh-gui.exe
          else
            cp "$BIN" "dist-bin/myownmesh-gui"
            tar -czf "dist-bin/${NAME}.tar.gz" -C dist-bin myownmesh-gui
            (cd dist-bin && (sha256sum "${NAME}.tar.gz" || shasum -a 256 "${NAME}.tar.gz") > "${NAME}.tar.gz.sha256")
            python scripts/verify-release-artifact.py --archive "dist-bin/${NAME}.tar.gz" --member myownmesh-gui
            rm -f dist-bin/myownmesh-gui
          fi

      - name: Write build-owned release asset manifest
        run: >-
          python scripts/verify-release-artifact.py
          --tree gui/src-tauri/target/${{ matrix.platform.target }}/release/bundle
          --tree dist-bin
          --write-asset-manifest "$RUNNER_TEMP/release-assets-${{ matrix.platform.name }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: release-asset-manifest-${{ matrix.platform.name }}
          path: ${{ runner.temp }}/release-assets-${{ matrix.platform.name }}.json

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist-bin/myownmesh-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The NanoKVM device target (Sophgo SG2002, T-Head C906 — riscv64 + musl).
  # Daemon ONLY: the Tauri GUI doesn't cross-compile here and isn't wanted on an
  # appliance. Built with the same Sophgo host-tools toolchain the NanoKVM
  # firmware uses, so `riscv64-unknown-linux-musl-gcc` matches .cargo/config.toml
  # exactly (no env overrides). Ships a static-musl myownmesh-linux-riscv64.tar.gz
  # — the asset a NanoKVM installs at its pinned `.myownmesh-rev`. See
  # docs/NANOKVM.md. A separate job (not a `bundles` matrix row) because that
  # matrix also builds the GUI, which has no riscv64 target.
  daemon-riscv64:
    name: Build (linux-riscv64)
    needs: [prepare-release, release-gates]
    runs-on: ubuntu-22.04
    env:
      MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
      MYOWNMESH_RELEASE_PUBKEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and repository binding
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          test "$(git remote get-url origin)" = "https://github.com/$GITHUB_REPOSITORY.git"

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: riscv64gc-unknown-linux-musl

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache (daemon workspace)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: daemon-riscv64

      # Build the static rv64gc musl binary with Zig as the C compiler + linker
      # (cargo-zigbuild). We deliberately do NOT use the device's Sophgo C906
      # host-tools: that gcc defaults to the T-Head vendor ISA
      # (rv64imafdcv0p7xthead), but rustc emits standard rv64gc objects, and GNU
      # ld cannot merge the vendor arch attributes with them — it dies with
      # "failed to merge target specific data of file ... libc.a(...)" when
      # linking Rust's self-contained musl libc. Zig links them cleanly, and a
      # static-musl rv64gc binary still runs on the C906 (full rv64gc base ISA).
      # Sourced from PyPI + crates.io (no fragile musl-gcc download). See
      # .cargo/config.toml and docs/NANOKVM.md.
      - name: Install Zig + cargo-zigbuild
        run: |
          set -e
          python3 -m pip install --upgrade "ziglang==0.13.0"
          printf '#!/usr/bin/env bash\nexec python3 -m ziglang "$@"\n' | sudo tee /usr/local/bin/zig >/dev/null
          sudo chmod +x /usr/local/bin/zig
          zig version
          cargo install cargo-zigbuild --locked

      - name: Build daemon (riscv64 musl)
        run: |
          zig version
          MYOWNMESH_RELEASE_PUBKEY="$MYOWNMESH_RELEASE_PUBKEY" cargo zigbuild --release --no-default-features --bin myownmesh --target riscv64gc-unknown-linux-musl

      - name: Verify daemon trust anchor (riscv64 musl)
        run: >-
          python scripts/verify-release-artifact.py
          --binary target/riscv64gc-unknown-linux-musl/release/myownmesh
          --release-public-key "$MINISIGN_PUBLIC_KEY"

      - name: Package portable daemon binary
        shell: bash
        run: |
          set -e
          BIN=target/riscv64gc-unknown-linux-musl/release/myownmesh
          [[ -f "$BIN" ]] || { echo "daemon binary not found at $BIN"; exit 1; }
          mkdir -p dist-bin
          NAME="myownmesh-linux-riscv64"
          cp "$BIN" "dist-bin/myownmesh"
          tar -czf "dist-bin/${NAME}.tar.gz" -C dist-bin myownmesh
          (cd dist-bin && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
          rm -f dist-bin/myownmesh
          python scripts/verify-release-artifact.py --archive "dist-bin/${NAME}.tar.gz" --member myownmesh

      - name: Write build-owned release asset manifest
        run: >-
          python scripts/verify-release-artifact.py
          --tree dist-bin
          --write-asset-manifest "$RUNNER_TEMP/release-assets-linux-riscv64.json"

      - uses: actions/upload-artifact@v4
        with:
          name: release-asset-manifest-linux-riscv64
          path: ${{ runner.temp }}/release-assets-linux-riscv64.json

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist-bin/myownmesh-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The NanoKVM-Pro device target (Axera AX630C, 2×Cortex-A53 — aarch64 + musl).
  # Daemon ONLY, same appliance rationale as daemon-riscv64: static-musl so it
  # runs on the Pro's glibc Ubuntu rootfs without a glibc-version dependency, and
  # immune to CI-runner/rootfs glibc drift. Built with cargo-zigbuild (Zig cross-
  # compiles from the x86_64 runner — no arm runner needed). Ships
  # myownmesh-linux-aarch64-musl.tar.gz — the asset a NanoKVM-Pro installs at its
  # pinned `.myownmesh-rev`. NOTE the `-musl` suffix: the plain
  # myownmesh-linux-aarch64.tar.gz name is already taken by the dynamic-glibc
  # DESKTOP build (the `bundles` matrix), so the appliance asset must not collide
  # with it. See .cargo/config.toml and docs/NANOKVM.md.
  daemon-aarch64-musl:
    name: Build (linux-aarch64-musl)
    needs: [prepare-release, release-gates]
    runs-on: ubuntu-22.04
    env:
      MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
      MYOWNMESH_RELEASE_PUBKEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and repository binding
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          test "$(git remote get-url origin)" = "https://github.com/$GITHUB_REPOSITORY.git"

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache (daemon workspace)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: daemon-aarch64-musl

      # Build the static aarch64 musl binary with Zig as the C compiler + linker
      # (cargo-zigbuild). Unlike riscv64 there is no vendor-ISA attribute-merge
      # conflict on aarch64; Zig is used purely for toolchain-free CI parity with
      # the riscv64 job. The `-u getrandom` guard in .cargo/config.toml still
      # applies — it is a static-musl hazard, not a riscv64 one.
      - name: Install Zig + cargo-zigbuild
        run: |
          set -e
          python3 -m pip install --upgrade "ziglang==0.13.0"
          printf '#!/usr/bin/env bash\nexec python3 -m ziglang "$@"\n' | sudo tee /usr/local/bin/zig >/dev/null
          sudo chmod +x /usr/local/bin/zig
          zig version
          cargo install cargo-zigbuild --locked

      - name: Build daemon (aarch64 musl)
        run: |
          zig version
          MYOWNMESH_RELEASE_PUBKEY="$MYOWNMESH_RELEASE_PUBKEY" cargo zigbuild --release --no-default-features --bin myownmesh --target aarch64-unknown-linux-musl

      - name: Verify daemon trust anchor (aarch64 musl)
        run: >-
          python scripts/verify-release-artifact.py
          --binary target/aarch64-unknown-linux-musl/release/myownmesh
          --release-public-key "$MINISIGN_PUBLIC_KEY"

      - name: Package portable daemon binary
        shell: bash
        run: |
          set -e
          BIN=target/aarch64-unknown-linux-musl/release/myownmesh
          [[ -f "$BIN" ]] || { echo "daemon binary not found at $BIN"; exit 1; }
          mkdir -p dist-bin
          NAME="myownmesh-linux-aarch64-musl"
          cp "$BIN" "dist-bin/myownmesh"
          tar -czf "dist-bin/${NAME}.tar.gz" -C dist-bin myownmesh
          (cd dist-bin && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
          rm -f dist-bin/myownmesh
          python scripts/verify-release-artifact.py --archive "dist-bin/${NAME}.tar.gz" --member myownmesh

      - name: Write build-owned release asset manifest
        run: >-
          python scripts/verify-release-artifact.py
          --tree dist-bin
          --write-asset-manifest "$RUNNER_TEMP/release-assets-linux-aarch64-musl.json"

      - uses: actions/upload-artifact@v4
        with:
          name: release-asset-manifest-linux-aarch64-musl
          path: ${{ runner.temp }}/release-assets-linux-aarch64-musl.json

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist-bin/myownmesh-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Detached Ed25519 (minisign) signatures over every uploaded release payload,
  # so provenance is verified before a draft becomes public. A missing key is a
  # hard failure: no published release is allowed without this evidence.
  sign:
    name: Sign release artifacts (minisign)
    needs: [prepare-release, release-gates, bundles, daemon-riscv64, daemon-aarch64-musl]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and repository binding
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          test "$(git remote get-url origin)" = "https://github.com/$GITHUB_REPOSITORY.git"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install minisign
        run: |
          set -euo pipefail
          minisign_archive="minisign-0.11-linux.tar.gz"
          minisign_archive_sha256="F0A0954413DF8531BEFED169E447A66DA6868D79052ED7E892E50A4291AF7AE0"
          curl -fsSL -o "$minisign_archive" \
            "https://github.com/jedisct1/minisign/releases/download/0.11/$minisign_archive"
          printf '%s  %s\n' "$minisign_archive_sha256" "$minisign_archive" | sha256sum --check
          tar -xzf "$minisign_archive"
          test -x minisign-linux/x86_64/minisign
          sudo install -m 0755 minisign-linux/x86_64/minisign /usr/local/bin/minisign

      - name: Gate on signing key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
          MYOWNMESH_RELEASE_PUBKEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$MINISIGN_SECRET_KEY" || { echo "::error::MINISIGN_SECRET_KEY is required"; exit 1; }
          test -n "$MINISIGN_PUBLIC_KEY" || { echo "::error::MINISIGN_PUBLIC_KEY is required"; exit 1; }
          test "$MYOWNMESH_RELEASE_PUBKEY" = "$MINISIGN_PUBLIC_KEY"

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -e
          mkdir -p signing
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir signing

      - name: Download build-owned asset allowlists
        uses: actions/download-artifact@v4
        with:
          pattern: release-asset-manifest-*
          path: allowlists
          merge-multiple: true

      - name: Refuse stale or tampered draft assets before signing
        run: >-
          python "$GITHUB_WORKSPACE/scripts/verify-release-artifact.py"
          --tree "$GITHUB_WORKSPACE/signing"
          --asset-allowlist "$GITHUB_WORKSPACE/allowlists"

      - name: Sign and upload signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -e
          SIGNING_KEY="$RUNNER_TEMP/myownmesh-minisign.key"
          trap 'rm -f "$SIGNING_KEY"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$SIGNING_KEY"
          cd signing
          mapfile -t payloads < <(find . -maxdepth 1 -type f \
            ! -name '*.minisig' ! -name '*.sha256' -print | sort)
          ((${#payloads[@]} > 0)) || { echo "no release payloads downloaded"; exit 1; }
          # Password-less CI key (see RELEASE-SIGNING.md): no prompt, </dev/null
          # guards against ever hanging on one.
          for f in "${payloads[@]}"; do
            minisign -S -s "$SIGNING_KEY" -m "$f" -x "$f.minisig" </dev/null
          done
          python "$GITHUB_WORKSPACE/scripts/verify-release-artifact.py" \
             --signature-tree "$GITHUB_WORKSPACE/signing" \
             --public-key "$MINISIGN_PUBLIC_KEY" \
             --asset-allowlist "$GITHUB_WORKSPACE/allowlists"
          mapfile -t signatures < <(find . -maxdepth 1 -type f -name '*.minisig' -print | sort)
          gh release upload "$TAG" "${signatures[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Recheck uploaded payload/signature set while draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
          TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="$RUNNER_TEMP/remote-release-assets"
          rm -rf "$remote_dir"
          mkdir -p "$remote_dir"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$remote_dir" --clobber
          python "$GITHUB_WORKSPACE/scripts/verify-release-artifact.py" \
            --verify-release-assets \
            --signature-tree "$GITHUB_WORKSPACE/signing" \
            --remote-tree "$remote_dir" \
            --public-key "$MINISIGN_PUBLIC_KEY" \
            --asset-allowlist "$GITHUB_WORKSPACE/allowlists" \
            --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY"

      - name: Publish signed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
          TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="$RUNNER_TEMP/final-release-assets"
          rm -rf "$remote_dir"
          mkdir -p "$remote_dir"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$remote_dir" --clobber
          python "$GITHUB_WORKSPACE/scripts/verify-release-artifact.py" \
            --verify-release-assets \
            --signature-tree "$GITHUB_WORKSPACE/signing" \
            --remote-tree "$remote_dir" \
            --public-key "$MINISIGN_PUBLIC_KEY" \
            --asset-allowlist "$GITHUB_WORKSPACE/allowlists" \
            --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY"
          python "$GITHUB_WORKSPACE/scripts/verify-release-artifact.py" \
            --preflight-release \
            --tag "$TAG" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
