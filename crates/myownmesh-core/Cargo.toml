[package]
name = "myownmesh-core"
description = "Mesh networking runtime, wire protocol, and topology — the only crate embedders need."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["mesh", "p2p", "webrtc", "ed25519", "topology"]
categories = ["network-programming", "asynchronous"]

[lib]
name = "myownmesh_core"
path = "src/lib.rs"

[features]
default = []
transport-lab = []
# Bounded, runtime-gated timing evidence for the routed application path.
# This is deliberately separate from `transport-lab`: the latter enables
# native fixture markers that are not part of a field diagnostic binary.
route-flow-diagnostics = []
# Select the platform DNS-SD backend through the signaling crate. Kept
# explicit so the default and no-default release boundaries remain unchanged.
system-dnssd = ["myownmesh-signaling/system-dnssd"]

[[example]]
name = "spin_min"
required-features = ["transport-lab"]

[[example]]
name = "spin_probe"
required-features = ["transport-lab"]

# Drives the authenticated-departure path through `depart_for_lab`, which only
# exists behind `transport-lab`. Gated here rather than with an inner `cfg` so
# an ordinary build does not build the target at all.
[[test]]
name = "peer_leave"
path = "tests/peer_leave.rs"
required-features = ["transport-lab"]

[dependencies]
myownmesh-signaling = { workspace = true }

tokio = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }

webrtc = { workspace = true }

dashmap = { workspace = true }
parking_lot = { workspace = true }
rusqlite = { workspace = true }

ed25519-dalek = { workspace = true }
rand_core = { workspace = true }
rand = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
hmac = { workspace = true }
aes-gcm = { workspace = true }
hkdf = { workspace = true }
x25519-dalek = { workspace = true }
data-encoding = { workspace = true }
hex = { workspace = true }
bytes = { workspace = true }

serde = { workspace = true }
bincode = { workspace = true }
serde_json = { workspace = true }

thiserror = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
if-addrs = "0.15"
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
