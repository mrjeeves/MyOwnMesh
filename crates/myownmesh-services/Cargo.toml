[dev-dependencies]
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
turn = { workspace = true, features = ["custody-lab"] }
myownmesh-core = { workspace = true, features = ["transport-lab"] }
myownmesh-signaling = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
