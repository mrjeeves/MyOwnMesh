[package]
name = "myownmesh"
description = "MyOwnMesh daemon and CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["mesh", "p2p", "webrtc", "nostr", "daemon"]
categories = ["command-line-utilities", "network-programming"]
# Binary crate, not for crates.io. Distribution path is the GitHub
# Releases matrix (`myownmesh-<platform>.{tar.gz,zip}`); see RELEASE.md.
publish = false

[features]
# Keep the shipped daemon feature-free by default; transport-lab is reserved
# for the explicit integration controls and never enters release artifacts.
default = []
transport-lab = ["myownmesh-core/transport-lab"]
# Forward the opt-in system DNS-SD backend through core to signaling.
system-dnssd = ["myownmesh-core/system-dnssd"]

[[bin]]
name = "myownmesh"
path = "src/main.rs"

# Embeds the VERSIONINFO resource into the Windows exe (see build.rs).
# Host-gated: build scripts compile for the host, and the Windows zip is
# built on a Windows runner.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
myownmesh-core = { workspace = true }
myownmesh-signaling = { workspace = true }
myownmesh-services = { workspace = true }
myownmesh-updater = { workspace = true }

tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
data-encoding = { workspace = true }
getrandom = { workspace = true }

interprocess = { workspace = true }
parking_lot = { workspace = true }
dirs = { workspace = true }

# `service --system` needs an effective-uid check to fail fast without
# root. Unix-only; the Windows build routes `service` to a manual-setup
# message and never touches libc.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
widestring = { workspace = true }
windows-sys = { workspace = true }

[dev-dependencies]
myownmesh-core = { workspace = true, features = ["transport-lab"] }
myownmesh-signaling = { workspace = true }
tempfile = { workspace = true }
